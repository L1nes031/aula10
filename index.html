<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>WellFlores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>
<body>
    <header class="topbar">
        <section class="inicio">
            <h1>Floricultura WellFlores Alegria</h1>
        </section>
    </header>
    <main>
        <section class="agrupamento card">
            <h2>Cadastro</h2>
            <div class="mb-3">
                <label for="formGroupExampleInput" class="form-label">Nome Completo:*</label>
                <input type="text" id="nome" class="form-control"  placeholder="Digite seu nome completo" required>
                <div id="validationServer01Valid" class="valid-feedback">Valido!</div>
                <div id="validationServer01Invalid" class="invalid-feedback">Adicione um valido!</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">E-mail:*</label>
                <input type="email" id="email" class="form-control" placeholder="Digite seu Email" required>
                 <div id="validationServer01Valid" class="valid-feedback">Valido!</div>
                <div id="validationServer01Invalid" class="invalid-feedback">Adicione um valido!</div>
            </div>

            <div>
                <label for="password2" class="form-label">Digite sua senha</label>
                <input type="password" class="form-control" id="password2" placeholder="Digite sua senha">
                <div class="strength" data-bs-strength>
                    <div class="strength-segment"></div>
                    <div class="strength-segment"></div>
                    <div class="strength-segment"></div>
                    <div class="strength-segment"></div>
                </div>
                <span class="strength-text"></span>
            </div>

             <div class="mb-3">
                <label for="senha" class="form-label">Confirmar senha:*</label>
                <input type="password" id="confirma-senha" class="form-control" placeholder="Confirme sua senha" required>
                 <div id="validationServer01Valid" class="valid-feedback">Valido!</div>
                <div id="validationServer01Invalid" class="invalid-feedback">Adicione um valido!</div>
            </div>

            <button type="submit" id="btnCadastrar" class="form-field">
                Cadastrar
            </button>
        </section>
    </main>
</body>
</html>
